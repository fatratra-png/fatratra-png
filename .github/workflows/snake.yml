name: Generate Snake

on:
  schedule:
    - cron: "*/30 * * * *"   # régénère toutes les 30 minutes
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Pick random dot colors
        id: colors
        run: |
          rand_hex() { printf '%02x%02x%02x' $((RANDOM%156+100)) $((RANDOM%156+100)) $((RANDOM%156+100)); }
          C1=$(rand_hex); C2=$(rand_hex); C3=$(rand_hex); C4=$(rand_hex)
          echo "dots=%23$C1,%23$C2,%23$C3,%23$C4" >> "$GITHUB_OUTPUT"

      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_dots=${{ steps.colors.outputs.dots }}&color_dots_border=%23151515
            dist/github-contribution-grid-snake.svg?color_dots=${{ steps.colors.outputs.dots }}&color_dots_border=%23e0e0e0

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
